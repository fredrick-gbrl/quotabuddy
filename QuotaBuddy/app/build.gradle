plugins { id 'com.android.application' }

android {
    namespace 'com.quotabuddy.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.quotabuddy.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '2.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
